<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC4F5"/>
      <stop offset="1" stop-color="#2D6CD6"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324A"/>
      <stop offset="1" stop-color="#151C2B"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
  </defs>

  <!-- background (Discord crops to a circle) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- ice floe -->
  <ellipse cx="512" cy="1010" rx="560" ry="150" fill="#E8F5FF" opacity=".9"/>

  <!-- body / hood -->
  <path d="M512 196
           C 700 196 806 350 806 540
           C 806 700 760 820 720 1024
           L 304 1024
           C 264 820 218 700 218 540
           C 218 350 324 196 512 196 Z" fill="url(#coat)"/>

  <!-- flippers -->
  <path d="M232 600 C 170 660 150 760 168 840 C 210 800 250 730 262 650 Z" fill="#151C2B"/>
  <path d="M792 600 C 854 660 874 760 856 840 C 814 800 774 730 762 650 Z" fill="#151C2B"/>

  <!-- face mask -->
  <path d="M512 640
           C 430 700 316 668 304 560
           C 294 470 352 400 424 404
           C 466 406 494 428 512 452
           C 530 428 558 406 600 404
           C 672 400 730 470 720 560
           C 708 668 594 700 512 640 Z" fill="#FFFFFF"/>

  <!-- belly -->
  <ellipse cx="512" cy="900" rx="196" ry="230" fill="#F4F8FC"/>

  <!-- eyes -->
  <circle cx="436" cy="508" r="36" fill="#151C2B"/>
  <circle cx="588" cy="508" r="36" fill="#151C2B"/>
  <circle cx="448" cy="494" r="12" fill="#FFFFFF"/>
  <circle cx="600" cy="494" r="12" fill="#FFFFFF"/>

  <!-- cheeks -->
  <ellipse cx="380" cy="586" rx="30" ry="18" fill="#FF8FA3" opacity=".75"/>
  <ellipse cx="644" cy="586" rx="30" ry="18" fill="#FF8FA3" opacity=".75"/>

  <!-- beak -->
  <path d="M470 566 Q 512 548 554 566 Q 540 612 512 620 Q 484 612 470 566 Z" fill="#FF9A2E"/>
  <path d="M478 572 Q 512 560 546 572" stroke="#E07A10" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- ping: ripples + notification badge -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity=".85">
    <path d="M846 178 A 150 150 0 0 1 900 330" stroke-width="22"/>
    <path d="M800 120 A 230 230 0 0 1 960 290" stroke-width="22" opacity=".6"/>
  </g>
  <circle cx="770" cy="270" r="104" fill="url(#badge)" stroke="#FFFFFF" stroke-width="20"/>
  <!-- bell -->
  <path d="M770 206
           C 728 206 712 238 712 270
           L 712 300 L 694 322 L 846 322 L 828 300 L 828 270
           C 828 238 812 206 770 206 Z" fill="#FFFFFF"/>
  <circle cx="770" cy="338" r="17" fill="#FFFFFF"/>
</svg>
