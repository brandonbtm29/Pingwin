# Install once with:  pip install pre-commit && pre-commit install
# Every commit is then scanned for secrets (like the bot token) and linted.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-private-settings
        name: Block .env / secrets.env / config.toml from being committed
        entry: "Refusing to commit a private settings file (.env, secrets.env or config.toml)."
        language: fail
        files: '(^|/)(\.env|secrets\.env|config\.toml)$'
